# PaySprint Merchant Portal - production configuration (excerpt)

# VULNERABILITY (A02: Security Misconfiguration) -> Fixed
# FIX (A02): expose only the endpoints actually needed, and never show raw
# environment values (which may include secrets) through actuator.
management.endpoints.web.exposure.include=health,info
management.endpoint.env.show-values=NEVER

# VULNERABILITY (A02: Security Misconfiguration): full stack traces returned to API clients in production.
# FIX (A02): never expose full stack traces to API clients in production.
server.error.include-stacktrace=never
server.error.include-message=never

# Shared secret used to verify incoming webhook signatures — set via environment variable
webhook.payment.secret=${WEBHOOK_SECRET}
